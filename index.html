<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AFTERLIFE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>AFTERLIFE</title>
<style>
:root{--bg:#08090B;--card:#14161A;--card2:#1C1F24;--tx:#fff;--mu:#92969E;--ac:#8b5cf6;--gold:#d4af37;--ok:#30d158;--bad:#ff453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f2f2f7;--card:#fff;--card2:#e5e5ea;--tx:#000;--mu:#6c6c70}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
main{flex:1;overflow-y:auto;padding:16px;max-width:720px;width:100%;margin:0 auto}
h1{font-size:30px;margin:8px 0 14px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--tx),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:15px;color:var(--mu);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--card);border:1px solid #ffffff0d;box-shadow:0 8px 24px #0006;border-radius:20px;padding:16px;margin-bottom:12px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:14px;padding:14px;background:var(--card2);color:var(--tx);cursor:pointer;width:100%;font-weight:600;transition:transform .1s}
button:active{transform:scale(.97)}button.p{background:var(--ac);color:#fff}button:disabled{opacity:.4}
input{font:inherit;width:100%;padding:14px;border-radius:14px;border:0;background:var(--card2);color:var(--tx);margin-bottom:10px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--gold)}.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
nav{display:flex;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--card2)}
nav button{background:none;border-radius:0;padding:10px 0 8px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:2px;align-items:center}
nav button.on{color:var(--ac)}nav span{font-size:20px}
.reels{display:flex;gap:8px;justify-content:center;font-size:48px;margin:10px 0}.reels div{background:var(--card2);border-radius:14px;padding:6px 14px}
.log{font-size:14px;color:var(--mu);margin:4px 0}.cols{display:grid;gap:12px}@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}main{max-width:1000px}}
@media(min-width:900px){body{flex-direction:row-reverse}nav{flex-direction:column;width:110px;border-top:0;border-right:1px solid var(--card2)}}
</style></head><body>
<main id="m"></main>
<nav id="n"></nav>
<script>
const K='afterlife_v1';
const D={name:'',age:18,money:500,health:80,joy:70,xp:0,job:'Arbeitslos',debt:0,shares:0,price:100,log:[],best:0,props:[],hist:[],items:[],biz:[],tx:[],story:[],pers:0,cars:[],fol:0,chats:{},rel:{},feed:[],started:false};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cl=v=>Math.max(0,Math.min(100,v));
const eur=v=>Math.round(v).toLocaleString('de-DE')+' €';
const lvl=()=>Math.floor(S.xp/100)+1;
const jobs=[['Aushilfe',1200,0],['Barkeeper',2200,3],['Programmierer',4500,8],['DJ',3800,5],['Manager',7000,12]];
const events=[
{t:'Ein Freund schreibt: „Ey, heute Abend ist eine riesige Party. Kommst du?“',o:[['Klar, bin dabei',{joy:15,money:-60,health:-5}],['Heute lieber nicht',{joy:-5,health:5}],['Ich bring noch jemanden mit',{joy:20,money:-100,xp:10}]]},
{t:'Du findest 200 € auf der Straße.',o:[['Behalten',{money:200,joy:5}],['Abgeben',{joy:10,xp:15}]]},
{t:'Dein Chef bietet dir Überstunden an.',o:[['Annehmen',{money:400,joy:-10,health:-5}],['Ablehnen',{joy:5}]]},
{t:'Du bekommst eine Grippe.',o:[['Arzt besuchen',{money:-80,health:15}],['Auskurieren',{health:-10,joy:-5}]]},
{t:'Ein Kumpel will dir eine „sichere“ Krypto-Idee verkaufen.',o:[['Reinstecken (300 €)',null],['Nein danke',{xp:10}]]},
{t:'Dein Instagram-Post geht viral.',o:[['Genießen',{joy:20,xp:20}],['Löschen (peinlich)',{joy:-5}]]}];
let ev=null,tab='home';
function ap(e){if(!e)return;for(const k in e){if(k==='money')S.money+=e[k];else if(k==='xp')S.xp+=e[k];else S[k]=cl(S[k]+e[k])}}
function year(){S.age++;const j=jobs.find(j=>j[0]===S.job);if(j)S.money+=j[1]*1;S.money-=900;S.props.forEach(p=>S.money+=PR[p][2]);S.hist=(S.hist||[]).concat(Math.round(S.money+S.shares*S.price-S.debt)).slice(-30);npcPost();if(S.debt)S.debt*=1.08;S.price=Math.max(10,S.price*(0.8+Math.random()*0.45));S.health=cl(S.health-(S.age>40?3:1));S.xp+=10;
S.log.unshift('Alter '+S.age+(j?': +'+eur(j[1]-900)+' netto':': −900 € Lebenskosten'));S.log=S.log.slice(0,6);ev=events[Math.random()*events.length|0];save();render()}
function pick(i){const o=ev.o[i];let e=o[1];if(e===null){if(S.money<300){S.log.unshift('Zu wenig Geld.');ev=null;save();return render()}S.money-=300;const w=Math.random()<.4;S.money+=w?900:0;S.log.unshift(w?'Krypto-Glück: +600 €':'Krypto-Pleite: −300 €')}else{ap(e);S.log.unshift(o[0])}ev=null;save();render()}
function setJob(n,p,l){if(lvl()<l+1&&l>0)return;S.job=n;S.log.unshift('Neuer Job: '+n);save();render()}
// Arcade
let reel=['🍒','🍋','7️⃣'],msg='';
const sy=['🍒','🍋','🔔','💎','7️⃣'];
function slots(){if(S.money<10)return;S.money-=10;reel=[0,0,0].map(()=>sy[Math.random()*5|0]);let w=0;if(reel[0]==reel[1]&&reel[1]==reel[2])w=reel[0]=='7️⃣'?500:100;else if(reel[0]==reel[1]||reel[1]==reel[2])w=20;S.money+=w;S.xp+=2;S.best=Math.max(S.best,w);msg=w?'Gewinn: +'+w+' Punkte':'Leider nichts';save();render()}
function wheel(){if(S.money<20)return;S.money-=20;const o=[0,0,10,20,40,80,200],w=o[Math.random()*o.length|0];S.money+=w;S.best=Math.max(S.best,w);msg='Glücksrad: '+(w?'+'+w:'0')+' Punkte';S.xp+=2;save();render()}
function dice(g){if(S.money<10)return;S.money-=10;const d=1+Math.random()*6|0;const win=g=='h'?d>3:d<=3;if(win)S.money+=20;msg='Würfel: '+d+(win?' – gewonnen +20':' – verloren');S.xp+=2;S.best=Math.max(S.best,win?20:0);save();render()}
// Bank
function loan(){S.money+=1000;S.debt+=1000;save();render()}
function repay(){const a=Math.min(S.money,S.debt);S.money-=a;S.debt-=a;save();render()}
function buy(){if(S.money<S.price)return;S.money-=S.price;S.shares++;save();render()}
function sell(){if(!S.shares)return;S.shares--;S.money+=S.price;save();render()}
function reset(){if(confirm('Spielstand wirklich löschen?')){localStorage.removeItem(K);S={...D};tab='home';render()}}
function stat(n,v){return `<div style="margin-top:10px"><div class="row mu"><span>${n}</span><span>${Math.round(v)}</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`}
function setTab(t){tab=t;render()}
function render(){
const m=document.getElementById('m');
if(!S.started){m.innerHTML=`<h1>AFTERLIFE</h1><div class="card"><p class="mu">Dein zweites Leben. Wie heißt dein Charakter?</p><input id="nm" placeholder="Name" maxlength="20" value="${esc(pnm)}"><p class="mu">Persönlichkeit</p><div class="grid" style="margin-bottom:12px">${PE.map((p,i)=>`<button ${pers==i?'class="p"':''} onclick="pnm=document.getElementById('nm').value;pers=${i};render()">${p[0]}</button>`).join('')}</div><button class="p" onclick="startG()">Leben starten</button></div>`;document.getElementById('n').style.display='none';return}
document.getElementById('n').style.display='flex';
const T=[['home','🏠','Home'],['life','🧬','Leben'],['city','🌃','Stadt'],['chat','💬','Chat'],['more','☰','Mehr']];
document.getElementById('n').innerHTML=T.map(t=>`<button class="${tab==t[0]||(t[0]=='more'&&!['home','life','city','chat'].includes(tab))?'on':''}" onclick="setTab('${t[0]}')"><span>${ic(({home:'home',life:'heart',city:'map',chat:'msg',more:'menu'})[t[0]])}</span>${t[2]}</button>`).join('');
let h='';
if(tab=='home'){h=`<h1>Hi, ${S.name}</h1><div class="cols"><div><div class="card"><div class="mu">Kontostand</div><div class="big">${eur(S.money)}</div><div class="mu">Alter ${S.age} · ${S.job} · Level ${lvl()}</div></div><div class="card">${stat('Gesundheit',S.health)}${stat('Laune',S.joy)}</div><button class="p" onclick="setTab('life')">Weiter im Leben</button></div><div><div class="card"><div class="mu">Vermögensverlauf</div><div class="big" style="font-size:24px">${eur(S.money+S.shares*S.price-S.debt)}</div>${spark()}</div><h2>Tagesmissionen</h2>${MI().map((m,i)=>`<div class="card row"><div>${m[0]}<div class="mu">Belohnung ${m[2]} €</div></div><button style="width:auto" ${m[1]&&!S.cl.includes(i)?'class="p"':'disabled'} onclick="claim(${i})">${S.cl.includes(i)?'✓':'Holen'}</button></div>`).join('')}<h2>Letzte Ereignisse</h2>${S.log.map(l=>`<div class="log">• ${l}</div>`).join('')||'<div class="log">Noch nichts passiert.</div>'}</div></div>`}
if(tab=='life'){h=`<h1>Leben</h1>`;if(S.health<=0){h+=`<div class="card"><b class="bad">Game Over.</b><p class="mu">${S.name} wurde ${S.age}.</p><button class="p" onclick="reset()">Neues Leben</button></div>`}else{
if(ev)h+=`<div class="card"><p>${ev.t}</p>${ev.o.map((o,i)=>`<button style="margin-bottom:8px" onclick="pick(${i})">${o[0]}</button>`).join('')}</div>`;
else h+=`<button class="p" onclick="year()">Ein Jahr weiter (Alter ${S.age+1})</button>`;
h+=`<h2>Jobs</h2>`+jobs.map((j,i)=>{const ok=lvl()>=j[2]/3+1||i==0;return `<div class="card row"><div><b>${j[0]}</b><div class="mu">${eur(j[1])}/Jahr · ab Level ${Math.ceil(j[2]/3+1)}</div></div><button style="width:auto" ${ok&&S.job!=j[0]?'':'disabled'} onclick="setJob('${j[0]}',0,0)">${S.job==j[0]?'Aktiv':'Nehmen'}</button></div>`}).join('')}}
if(tab=='arc'){h=`<h1>Arcade</h1><p class="mu">Nur virtuelle Spielpunkte – kein echtes Geld.</p><div class="card"><div class="mu">Spielpunkte: ${eur(S.money).replace('€','')}</div><div class="reels">${reel.map(r=>`<div>${r}</div>`).join('')}</div><button class="p" onclick="slots()">Slots drehen (10)</button></div><div class="grid"><button onclick="wheel()">🎡 Glücksrad (20)</button><button onclick="dice('h')">🎲 Hoch (4–6)</button></div><div class="grid" style="margin-top:10px"><button onclick="dice('l')">🎲 Tief (1–3)</button><div class="card mu" style="margin:0">Rekord: ${S.best}</div></div><p style="text-align:center">${msg}</p>${bjHtml()}${rgH()}`}
if(tab=='bank'){const pf=S.shares*S.price;h=`<h1>Bank</h1><div class="card"><div class="mu">Konto</div><div class="big">${eur(S.money)}</div><div class="mu bad">Schulden: ${eur(S.debt)}</div></div><div class="grid"><button onclick="loan()">Kredit +1.000</button><button onclick="repay()">Tilgen</button></div><h2>Transaktionen</h2><div class="card">${S.tx.slice(0,6).map(t=>`<div class="row log"><span>${esc(t[0])}</span><span class="${t[1]<0?'bad':'ok'}">${t[1]<0?'':'+'}${eur(t[1])}</span></div>`).join('')||'<div class="log">Noch keine.</div>'}</div><h2>Börse – AFTR Aktie</h2><div class="card"><div class="row"><div class="big">${eur(S.price)}</div><div class="mu">${S.shares} Stück · ${eur(pf)}</div></div><div class="grid" style="margin-top:10px"><button class="p" onclick="buy()">Kaufen</button><button onclick="sell()">Verkaufen</button></div><p class="mu">Kurs ändert sich mit jedem Lebensjahr.</p></div>`}
if(tab=='prof'){h=`<h1>Profil</h1><div class="card"><b>${S.name}</b><div class="mu">Level ${lvl()} · ${S.xp} XP</div><div class="bar"><i style="width:${S.xp%100}%"></i></div></div><div class="card mu">Arcade-Rekord: ${S.best}<br>Aktien: ${S.shares}<br>Beruf: ${S.job}<br>Follower: ${S.fol}</div><h2>Erfolge</h2>${ACH().map(a=>`<div class="card">${a[1]?'🏆':'🔒'} ${a[0]}</div>`).join('')}<h2>Lebensgeschichte</h2><div class="card">${S.story.slice(-8).reverse().map(l=>`<div class="log">• ${esc(l)}</div>`).join('')}</div><div class="grid" style="margin-bottom:10px"><button onclick="exp()">Export</button><button onclick="imp()">Import</button></div>${ex?`<textarea id="ta" style="width:100%;height:120px;border-radius:14px;border:0;background:var(--card2);color:var(--tx);padding:10px;margin-bottom:10px">${esc(ex.trim())}</textarea><button class="p" style="margin-bottom:10px" onclick="ld()">Aus Feld laden</button>`:''}<button onclick="reset()">Spielstand löschen</button>`}
if(tab=='city')h=cityH();if(tab=='chat')h=chatH();if(tab=='more')h=moreH();if(tab=='prop')h=propH();if(tab=='car')h=carH();if(tab=='soc')h=socH();if(tab=='biz')h=bizH();if(tab=='shop')h=shopH();if(tab=='games')h=gamesH();
if(['arc','bank','prof','prop','car','soc','biz','shop','games'].includes(tab))h='<button style="width:auto;padding:8px 14px;margin-bottom:8px" onclick="setTab(\'more\')">‹ Mehr</button>'+h;
m.innerHTML=h;showLE();if(tab=='games'&&gm&&gm!='chess'&&!run){run=1;requestAnimationFrame(loopC)}}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const PR=[['🏢','Studio',900,15000],['🏙️','Wohnung',2200,40000],['🏡','Haus',4500,90000],['🏰','Villa',12000,250000],['🌆','Penthouse',20000,400000]];
const CR=[['🚗','Kleinwagen · Fiat Pandino',4000],['🏎️','Sportwagen · Vortex GT',40000],['🚘','Luxusauto · Maison S',70000],['🚙','SUV · Trailer X',25000],['🚕','Oldtimer · Classic 67',18000]];
const COL=['Schwarz','Weiß','Rot','Blau','Silber'];
function bProp(i){if(S.money<PR[i][3]||S.props.includes(i))return;S.money-=PR[i][3];S.props.push(i);S.xp+=30;save();render()}
function sProp(i){S.props=S.props.filter(x=>x!=i);S.money+=PR[i][3]*.9;save();render()}
function propH(){return `<h1>Immobilien</h1><p class="mu">Besitzt du eine Immobilie, wird sie automatisch vermietet (Miete pro Jahr).</p>`+PR.map((p,i)=>{const o=S.props.includes(i);return `<div class="card row"><div><b>${p[0]} ${p[1]}</b><div class="mu">${eur(p[3])} · Miete ${eur(p[2])}/Jahr</div></div><button style="width:auto" ${!o&&S.money<p[3]?'disabled':''} onclick="${o?'sProp':'bProp'}(${i})">${o?'Verkaufen':'Kaufen'}</button></div>`}).join('')}
function bCar(i){if(S.money<CR[i][2])return;S.money-=CR[i][2];S.cars.push({i,c:0});S.xp+=20;save();render()}
function sCar(k){S.money+=CR[S.cars[k].i][2]*.7;S.cars.splice(k,1);save();render()}
function pCar(k){S.cars[k].c=(S.cars[k].c+1)%5;save();render()}
function carH(){return `<h1>Fahrzeuge</h1><h2>Garage (${S.cars.length})</h2>`+(S.cars.map((c,k)=>`<div class="card"><b>${CR[c.i][0]} ${CR[c.i][1]}</b><div class="mu">Lack: ${COL[c.c]}</div><div class="grid" style="margin-top:8px"><button onclick="pCar(${k})">Umlackieren</button><button onclick="sCar(${k})">Verkaufen (70%)</button></div></div>`).join('')||'<div class="mu">Noch leer.</div>')+`<h2>Händler</h2>`+CR.map((c,i)=>`<div class="card row"><div><b>${c[0]} ${c[1]}</b><div class="mu">${eur(c[2])}</div></div><button style="width:auto" ${S.money<c[2]?'disabled':''} onclick="bCar(${i})">Kaufen</button></div>`).join('')}
const PL=[['🪩','Club',60,['Der DJ ruft deinen Namen aus – alle feiern dich.',{joy:15}],['Du verschüttest einen Drink auf einen Influencer. Skandal!',{joy:-5,f:40}]],['🕺','Disco',50,['Dein Tanzmove geht viral.',{joy:10,f:80}],['Du tanzt allein zu Schlagermusik. Peinlich, aber geil.',{joy:8,xp:5}]],['🍸','Bar',30,['Ein Fremder erzählt dir zwei Stunden von seiner Ex.',{joy:-3,xp:10}],['Bar-Quiz gewonnen: 50 € Gutschein.',{joy:10,money:50}]],['🏠','Hausparty',0,['Jemand setzt das Wohnzimmer unter Wasser. Kevin war es.',{joy:12,health:-3}],['Du knutschst aus Versehen die falsche Person.',{joy:5,f:30}]],['🍝','Restaurant',80,['Das Essen ist perfekt.',{joy:15,health:5}],['Die Rechnung kommt – dein Date ist weg.',{joy:-10,money:-40}]],['🛍️','Einkaufszentrum',100,['Du kaufst drei Hoodies und brauchst keinen.',{joy:12}],['Du verläufst dich 40 Minuten im Parkhaus.',{joy:-5}]],['🌳','Park',0,['Ein Eichhörnchen klaut dein Sandwich.',{joy:8,health:5}],['Du triffst jemanden beim Joggen, der dein Leben verändert.',{health:10,xp:15}]],['💎','Luxusviertel',300,['Du wirst für einen Millionär gehalten und gratis bedient.',{joy:20,money:150}],['Du fotografierst eine Villa, die Security schaut böse.',{joy:-8,f:60}]]];
let cm='';
function visit(i){const p=PL[i];if(S.money<p[2])return;S.money-=p[2];const e=p[3+(Math.random()<.5?0:1)];const {f,...r}=e[1];ap(r);S.fol+=f||0;S.xp+=5;cm=p[1]+': '+e[0];S.log.unshift(cm);S.log=S.log.slice(0,6);save();render()}
function cityH(){return `<h1>Stadt</h1>`+(cm?`<div class="card">${cm}</div>`:'')+`<div class="grid">`+PL.map((p,i)=>`<button ${S.money<p[2]?'disabled':''} onclick="visit(${i})">${p[0]} ${p[1]}<div class="mu">${p[2]?eur(p[2]):'gratis'}</div></button>`).join('')+`</div>`}
const NP=[['Kevin','😎','Chaot & Zocker','Bruder.',['Bruder, du glaubst nicht, was mir gestern passiert ist.','Ich hab gestern drei Stunden im Späti über Aliens diskutiert.']],['Lena','🎧','DJ & Nachtschwärmerin','Ehrlich jetzt.',['Ich mixe morgen im Club, komm vorbei.','Ich hab gestern bis 6 Uhr Platten sortiert.']],['Omar','💼','Gründer, immer im Hustle','Business ist Business.',['Ich hab da eine Idee, die alles ändert.','Mein Startup hat Umsatz, aber null Gewinn. Läuft.']]];
const RU=n=>['Kevin soll bei Lenas Gig den Strom abgeschaltet haben.','Omar soll in Wahrheit pleite sein.',n+' soll bald berühmt werden.'];
